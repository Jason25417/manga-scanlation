[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-scanlation"
version = "0.1.0"
description = "Batch translate and letter comic/manga pages: detect text, erase it, translate, and typeset the result."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "manga-scanlation contributors" }]
keywords = ["manga", "comic", "translation", "scanlation", "inpainting", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mscan = "manga_scanlation.cli:main"

[project.urls]
Homepage = "https://github.com/Jason25417/manga-scanlation"

[tool.setuptools.packages.find]
include = ["manga_scanlation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
